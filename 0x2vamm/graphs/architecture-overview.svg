<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320">
  <rect width="720" height="320" fill="#09090b"/>
  <defs>
    <marker id="a" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <path d="M0,0 L6,2 L0,4 Z" fill="#333"/>
    </marker>
  </defs>

  <!-- Title bar -->
  <text x="360" y="28" fill="#fafafa" font-size="16" text-anchor="middle" font-weight="600" font-family="system-ui,sans-serif">V-AMM</text>
  <text x="360" y="44" fill="#52525b" font-size="10" text-anchor="middle" font-family="system-ui,sans-serif">Volatility-Adaptive Automated Market Maker on Solana</text>

  <!-- === ROW 1: Three panels === -->

  <!-- Panel A: Instructions -->
  <rect x="28" y="60" width="200" height="196" rx="6" fill="#0c0c0e" stroke="#1a1a1e"/>
  <rect x="28" y="60" width="200" height="28" rx="6" fill="#121216"/>
  <rect x="28" y="76" width="200" height="12" fill="#121216"/>
  <text x="128" y="78" fill="#52525b" font-size="9" text-anchor="middle" font-weight="500" font-family="system-ui,sans-serif" letter-spacing="4">INSTRUCTIONS</text>

  <g font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#d4d4d8">
    <rect x="44" y="96" width="168" height="22" rx="3" fill="#0a0a0c"/>
    <text x="128" y="111" text-anchor="middle">initialize_pool</text>
    <rect x="44" y="122" width="168" height="22" rx="3" fill="#0a0a0c"/>
    <text x="128" y="137" text-anchor="middle">swap</text>
    <rect x="44" y="148" width="168" height="22" rx="3" fill="#0a0a0c"/>
    <text x="128" y="163" text-anchor="middle">add_liquidity</text>
    <rect x="44" y="174" width="168" height="22" rx="3" fill="#0a0a0c"/>
    <text x="128" y="189" text-anchor="middle">remove_liquidity</text>
    <rect x="44" y="200" width="168" height="22" rx="3" fill="#0a1a0a"/>
    <text x="128" y="215" fill="#4ade80" text-anchor="middle">update_volatility</text>
    <rect x="44" y="226" width="168" height="22" rx="3" fill="#0a1a0a"/>
    <text x="128" y="241" fill="#4ade80" text-anchor="middle">update_curve</text>
  </g>

  <!-- Panel B: Math Engine -->
  <rect x="260" y="60" width="200" height="136" rx="6" fill="#0c0c0e" stroke="#1a1a1e"/>
  <rect x="260" y="60" width="200" height="28" rx="6" fill="#121216"/>
  <rect x="260" y="76" width="200" height="12" fill="#121216"/>
  <text x="360" y="78" fill="#52525b" font-size="9" text-anchor="middle" font-weight="500" font-family="system-ui,sans-serif" letter-spacing="4">MATH ENGINE</text>

  <g font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#d4d4d8">
    <rect x="276" y="96" width="168" height="22" rx="3" fill="#0a0a0c"/>
    <text x="360" y="111" text-anchor="middle">StableSwap D solver</text>
    <rect x="276" y="122" width="168" height="22" rx="3" fill="#0a0a0c"/>
    <text x="360" y="137" text-anchor="middle">VolatilityMath EWMA</text>
    <rect x="276" y="148" width="168" height="22" rx="3" fill="#0a0a0c"/>
    <text x="360" y="163" text-anchor="middle">fee synthesis</text>
  </g>

  <!-- Panel C: State Accounts -->
  <rect x="492" y="60" width="200" height="136" rx="6" fill="#0c0c0e" stroke="#1a1a1e"/>
  <rect x="492" y="60" width="200" height="28" rx="6" fill="#121216"/>
  <rect x="492" y="76" width="200" height="12" fill="#121216"/>
  <text x="592" y="78" fill="#52525b" font-size="9" text-anchor="middle" font-weight="500" font-family="system-ui,sans-serif" letter-spacing="4">STATE ACCOUNTS</text>

  <g font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" fill="#d4d4d8">
    <rect x="508" y="96" width="168" height="36" rx="3" fill="#0a0a0c"/>
    <text x="592" y="112" text-anchor="middle">PoolState</text>
    <text x="592" y="124" font-size="8" fill="#52525b" text-anchor="middle" font-family="system-ui,sans-serif">reserves A fee curve data</text>
    <rect x="508" y="138" width="168" height="36" rx="3" fill="#0a0a0c"/>
    <text x="592" y="154" text-anchor="middle">VolatilityState</text>
    <text x="592" y="166" font-size="8" fill="#52525b" text-anchor="middle" font-family="system-ui,sans-serif">EWMA ring buffers tick</text>
  </g>

  <!-- Connectors row 1 -->
  <line x1="228" y1="128" x2="260" y2="128" stroke="#27272a" stroke-width="1" marker-end="url(#a)"/>
  <line x1="460" y1="128" x2="492" y2="128" stroke="#27272a" stroke-width="1" marker-end="url(#a)"/>

  <!-- === ROW 2: External & Flow === -->
  <rect x="28" y="264" width="664" height="28" rx="6" fill="#0c0c0e" stroke="#1a1a1e"/>
  <text x="360" y="282" fill="#52525b" font-size="9" text-anchor="middle" font-family="system-ui,sans-serif">External CPIs — SPL Token · Associated Token · System Program · Clock Sysvar · Rent</text>

  <!-- Vertical connectors -->
  <line x1="128" y1="256" x2="128" y2="264" stroke="#27272a" stroke-width="1" marker-end="url(#a)"/>
  <line x1="360" y1="196" x2="360" y2="264" stroke="#27272a" stroke-width="1" marker-end="url(#a)"/>
  <line x1="592" y1="196" x2="592" y2="264" stroke="#27272a" stroke-width="1" marker-end="url(#a)"/>

  <!-- Flow bar at bottom -->
  <rect x="28" y="300" width="664" height="20" rx="4" fill="#0a0a0c" stroke="#121216"/>
  <text x="360" y="314" fill="#3f3f46" font-size="9" text-anchor="middle" font-family="system-ui,sans-serif">swap writes price breadcrumb → EWMA tracks variance → annualize σ → A ramps · fee slides (10 bps/slot max)</text>
</svg>
