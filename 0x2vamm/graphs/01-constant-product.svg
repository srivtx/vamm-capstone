<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" style="background:#0d1117;border-radius:8px">
  <!-- Background grid -->
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#21262d" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect x="50" y="20" width="370" height="230" fill="url(#grid)" opacity="0.5"/>

  <!-- Axes -->
  <line x1="50" y1="250" x2="390" y2="250" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="50" y1="250" x2="50" y2="20" stroke="#8b949e" stroke-width="1.5"/>
  <polygon points="390,250 382,246 382,254" fill="#8b949e"/>
  <polygon points="50,20 46,28 54,28" fill="#8b949e"/>

  <!-- Axis labels -->
  <text x="395" y="272" fill="#e6edf3" font-size="13" text-anchor="end" font-weight="bold">USDC (x)</text>
  <text x="12" y="135" fill="#e6edf3" font-size="13" transform="rotate(-90,12,135)" font-weight="bold">SOL (y)</text>

  <!-- X-axis ticks -->
  <line x1="94" y1="246" x2="94" y2="254" stroke="#8b949e"/>
  <text x="94" y="268" fill="#8b949e" font-size="11" text-anchor="middle">25</text>
  <line x1="138" y1="246" x2="138" y2="254" stroke="#8b949e"/>
  <text x="138" y="268" fill="#8b949e" font-size="11" text-anchor="middle">50</text>
  <line x1="182" y1="246" x2="182" y2="254" stroke="#8b949e" stroke-width="1.5"/>
  <text x="182" y="268" fill="#e6edf3" font-size="11" text-anchor="middle" font-weight="bold">100</text>
  <line x1="270" y1="246" x2="270" y2="254" stroke="#8b949e"/>
  <text x="270" y="268" fill="#8b949e" font-size="11" text-anchor="middle">200</text>

  <!-- Y-axis ticks -->
  <line x1="46" y1="228" x2="54" y2="228" stroke="#8b949e"/>
  <text x="42" y="232" fill="#8b949e" font-size="11" text-anchor="end">0.5</text>
  <line x1="46" y1="206" x2="54" y2="206" stroke="#8b949e" stroke-width="1.5"/>
  <text x="42" y="210" fill="#e6edf3" font-size="11" text-anchor="end" font-weight="bold">1</text>
  <line x1="46" y1="184" x2="54" y2="184" stroke="#8b949e"/>
  <text x="42" y="188" fill="#8b949e" font-size="11" text-anchor="end">2</text>
  <line x1="46" y1="140" x2="54" y2="140" stroke="#8b949e"/>
  <text x="42" y="144" fill="#8b949e" font-size="11" text-anchor="end">5</text>
  <line x1="46" y1="118" x2="54" y2="118" stroke="#8b949e"/>
  <text x="42" y="122" fill="#8b949e" font-size="11" text-anchor="end">10</text>

  <!-- Curve: x*y=100. Mapped from (USDC, SOL) to (px, py) -->
  <!-- USDC scale: 0->50, 200->270. SOL scale: 0->250, 10->118, 5->140, 2->184, 1->206, 0.5->228, 0.1->241 -->
  <polyline points="
    54,238 58,224 62,210 67,200 72,192 77,185 82,180 88,175 94,171
    100,167 106,164 113,161 120,158 127,156 134,153 141,151
    148,150 155,148 162,147 169,145 176,144 183,143 190,142
    197,141 204,140 211,139 218,138 225,137 232,136 239,135
    246,134 253,133 260,133 267,132 274,131 281,131 288,130
    295,129 302,129 309,128 316,128 323,127 330,127 337,126
    344,126 351,125 358,125 365,124 372,124 379,123
  " fill="none" stroke="#58a6ff" stroke-width="2.5"/>

  <!-- Highlighted points from the table -->
  <!-- (10, 10): USDC=10->x=54, SOL=10->y=118 -->
  <circle cx="54" cy="118" r="4" fill="#f0883e"/>
  <text x="58" y="114" fill="#f0883e" font-size="10">(10, 10) cheap SOL</text>

  <!-- (50, 2): USDC=50->x=138, SOL=2->y=184 -->
  <circle cx="138" cy="184" r="4" fill="#f0883e"/>
  <text x="108" y="178" fill="#f0883e" font-size="10">(50, 2)</text>

  <!-- (100, 1): THE pool start -->
  <circle cx="182" cy="206" r="5" fill="#f0883e" stroke="#e6edf3" stroke-width="1"/>
  <text x="186" y="202" fill="#f0883e" font-size="11" font-weight="bold">(100, 1) pool start</text>

  <!-- (200, 0.5): USDC=200->x=270, SOL=0.5->y=228 -->
  <circle cx="270" cy="228" r="4" fill="#f0883e"/>
  <text x="250" y="246" fill="#f0883e" font-size="10">(200, 0.5)</text>

  <!-- (500, 0.2): approx -->
  <circle cx="325" cy="237" r="3" fill="#f0883e"/>
  <text x="290" y="242" fill="#f0883e" font-size="10">(500, 0.2)</text>

  <!-- Annotation: curve properties -->
  <text x="230" y="50" fill="#8b949e" font-size="11">curve never touches x-axis or y-axis</text>
  <text x="230" y="67" fill="#8b949e" font-size="11">pool never drains — just approaches the axes</text>

  <!-- Annotation: price relationship -->
  <text x="300" y="95" fill="#d2a8ff" font-size="10">steep here: small USDC change</text>
  <text x="300" y="111" fill="#d2a8ff" font-size="10">moves SOL a lot (cheap SOL)</text>

  <text x="80" y="100" fill="#d2a8ff" font-size="10">flat here: need lots of USDC</text>
  <text x="80" y="116" fill="#d2a8ff" font-size="10">to move SOL a little (expensive SOL)</text>

  <!-- Title -->
  <text x="220" y="16" fill="#e6edf3" font-size="15" text-anchor="middle" font-weight="bold">x · y = 100 (Constant Product AMM)</text>
</svg>
