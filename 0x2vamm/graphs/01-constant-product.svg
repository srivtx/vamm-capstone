<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" style="background:#0d1117;border-radius:8px">
  <!-- Axes -->
  <line x1="50" y1="250" x2="370" y2="250" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="50" y1="250" x2="50" y2="20" stroke="#8b949e" stroke-width="1.5"/>
  <!-- Axis labels -->
  <text x="370" y="270" fill="#8b949e" font-size="12" text-anchor="end">USDC (x)</text>
  <text x="10" y="140" fill="#8b949e" font-size="12" transform="rotate(-90,10,140)">SOL (y)</text>
  <!-- Ticks x-axis -->
  <line x1="114" y1="245" x2="114" y2="255" stroke="#8b949e" stroke-width="1"/>
  <text x="114" y="268" fill="#8b949e" font-size="10" text-anchor="middle">50</text>
  <line x1="178" y1="245" x2="178" y2="255" stroke="#8b949e" stroke-width="1"/>
  <text x="178" y="268" fill="#8b949e" font-size="10" text-anchor="middle">100</text>
  <line x1="242" y1="245" x2="242" y2="255" stroke="#8b949e" stroke-width="1"/>
  <text x="242" y="268" fill="#8b949e" font-size="10" text-anchor="middle">200</text>
  <!-- Ticks y-axis -->
  <line x1="45" y1="186" x2="55" y2="186" stroke="#8b949e" stroke-width="1"/>
  <text x="40" y="190" fill="#8b949e" font-size="10" text-anchor="end">2</text>
  <line x1="45" y1="122" x2="55" y2="122" stroke="#8b949e" stroke-width="1"/>
  <text x="40" y="126" fill="#8b949e" font-size="10" text-anchor="end">4</text>
  <line x1="45" y1="58" x2="55" y2="58" stroke="#8b949e" stroke-width="1"/>
  <text x="40" y="62" fill="#8b949e" font-size="10" text-anchor="end">8</text>
  <!-- Curve: x*y=100, mapped: x in [0,320]px represents USDC [0,250], y represents SOL -->
  <!-- Points: (10,10)->(13,218), (25,4)->(32,122), (50,2)->(64,186), (100,1)->(128,218), (200,0.5)->(256,234) -->
  <!-- Using y_px = 250 - (y * 27.5) scaled: for y=10 px=250-275=-25(clip), y=5 px=250-137.5=112, y=1 px=250-27.5=222, y=0.1 px=247 -->
  <polyline points="
    56,10 63,30 70,50 77,65 84,78 91,90 98,100 105,110 112,118
    119,126 126,133 133,140 140,146 147,152 154,157 161,162
    168,167 175,171 182,175 189,179 196,183 203,186 210,189
    217,192 224,195 231,198 238,201 245,203 252,206 259,208
    266,210 273,212 280,214 287,216 294,218 301,220 308,222
    315,224 322,226 329,227 336,229 343,230 350,232 357,233
    364,234
  " fill="none" stroke="#58a6ff" stroke-width="2.5"/>
  <!-- Point labels -->
  <circle cx="178" cy="218" r="4" fill="#f0883e"/>
  <text x="184" y="214" fill="#f0883e" font-size="11">(100, 1) pool start</text>
  <circle cx="242" cy="234" r="3" fill="#f0883e"/>
  <text x="248" y="238" fill="#f0883e" font-size="10">(200, 0.5)</text>
  <circle cx="114" cy="186" r="3" fill="#f0883e"/>
  <text x="60" y="182" fill="#f0883e" font-size="10">(50, 2)</text>
  <!-- Title -->
  <text x="210" y="22" fill="#e6edf3" font-size="14" text-anchor="middle" font-weight="bold">x · y = 100 (Constant Product)</text>
  <!-- Annotation -->
  <text x="250" y="60" fill="#8b949e" font-size="11">curve never touches axes</text>
  <text x="250" y="76" fill="#8b949e" font-size="11">pool never drains completely</text>
</svg>
