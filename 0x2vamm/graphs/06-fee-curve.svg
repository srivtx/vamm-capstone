<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" style="background:#0d1117;border-radius:8px">
  <!-- Axes -->
  <line x1="60" y1="180" x2="380" y2="180" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="60" y1="180" x2="60" y2="20" stroke="#8b949e" stroke-width="1.5"/>
  <text x="380" y="200" fill="#8b949e" font-size="11" text-anchor="end">volatility (sigma)</text>
  <text x="10" y="100" fill="#8b949e" font-size="11" transform="rotate(-90,10,100)">fee (bps)</text>

  <!-- X-axis ticks and labels -->
  <line x1="92" y1="176" x2="92" y2="184" stroke="#8b949e"/>
  <text x="92" y="196" fill="#8b949e" font-size="9" text-anchor="middle">15%</text>
  <line x1="188" y1="176" x2="188" y2="184" stroke="#8b949e"/>
  <text x="188" y="196" fill="#8b949e" font-size="9" text-anchor="middle">75%</text>
  <line x1="252" y1="176" x2="252" y2="184" stroke="#8b949e"/>
  <text x="252" y="196" fill="#8b949e" font-size="9" text-anchor="middle">120%</text>

  <!-- Y-axis ticks and labels -->
  <line x1="56" y1="164" x2="64" y2="164" stroke="#8b949e"/>
  <text x="52" y="168" fill="#8b949e" font-size="9" text-anchor="end">5</text>
  <line x1="56" y1="132" x2="64" y2="132" stroke="#8b949e"/>
  <text x="52" y="136" fill="#8b949e" font-size="9" text-anchor="end">30</text>
  <line x1="56" y1="68" x2="64" y2="68" stroke="#8b949e"/>
  <text x="52" y="72" fill="#8b949e" font-size="9" text-anchor="end">100</text>
  <line x1="56" y1="100" x2="64" y2="100" stroke="#8b949e"/>
  <text x="52" y="104" fill="#8b949e" font-size="9" text-anchor="end">65</text>

  <!-- Zone labels -->
  <text x="76" y="30" fill="#3fb950" font-size="10" text-anchor="middle">flat 5 bps</text>
  <text x="140" y="30" fill="#58a6ff" font-size="10" text-anchor="middle">smoothstep</text>
  <text x="220" y="30" fill="#d2a8ff" font-size="10" text-anchor="middle">smoothstep</text>
  <text x="316" y="30" fill="#f85149" font-size="10" text-anchor="middle">capped 100 bps</text>

  <!-- Zone backgrounds -->
  <rect x="60" y="36" width="32" height="144" fill="#3fb950" opacity="0.08" rx="2"/>
  <rect x="92" y="36" width="96" height="144" fill="#58a6ff" opacity="0.08" rx="2"/>
  <rect x="188" y="36" width="64" height="144" fill="#d2a8ff" opacity="0.08" rx="2"/>
  <rect x="252" y="32" width="128" height="148" fill="#f85149" opacity="0.08" rx="2"/>

  <!-- Fee curve (smoothstep) -->
  <!-- Band 1: 5 bps flat until 15%, then smoothstep to 30 at 75% -->
  <!-- sigma scale: 0%->x=60, 150%->x=380. fee scale: 0bps->y=180, 120bps->y=36 -->
  <!-- Points: (0%,5bps)->(60,168), (15%,5bps)->(92,168), smoothstep to (75%,30bps)->(188,132) -->
  <!-- Band 2: smoothstep (75%,30)->(120%,100). (120%,100bps)->(252,68) -->
  <!-- After 120%: flat at 100bps -> (380,68) -->
  <polyline points="
    60,168 92,168
    92,168 108,163 124,156 140,148 156,141 172,135 188,132
    188,132 198,118 208,104 218,90 228,78 238,70 252,68
    252,68 380,68
  " fill="none" stroke="#e6edf3" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Flat region highlight -->
  <line x1="60" y1="168" x2="92" y2="168" stroke="#3fb950" stroke-width="3"/>
  <line x1="252" y1="68" x2="380" y2="68" stroke="#f85149" stroke-width="3"/>

  <!-- Vertical dashed lines at thresholds -->
  <line x1="92" y1="36" x2="92" y2="168" stroke="#8b949e" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="188" y1="36" x2="188" y2="132" stroke="#8b949e" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="252" y1="36" x2="252" y2="68" stroke="#8b949e" stroke-width="0.5" stroke-dasharray="4,4"/>

  <text x="220" y="14" fill="#e6edf3" font-size="13" text-anchor="middle" font-weight="bold">Dynamic Fee Curve — fee(sigma) via smoothstep</text>
</svg>
