<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" style="background:#0d1117;border-radius:8px">
  <!-- ===== LEFT: Constant Sum ===== -->
  <text x="88" y="22" fill="#3fb950" font-size="12" text-anchor="middle" font-weight="bold">Constant Sum: x + y = 200</text>

  <line x1="20" y1="140" x2="156" y2="140" stroke="#8b949e" stroke-width="1.2"/>
  <line x1="20" y1="140" x2="20" y2="30" stroke="#8b949e" stroke-width="1.2"/>
  <text x="88" y="162" fill="#8b949e" font-size="10" text-anchor="middle">USDC</text>
  <text x="8" y="88" fill="#8b949e" font-size="10" transform="rotate(-90,8,88)">USDT</text>

  <!-- Diagonal line from (0,200) to (200,0) -->
  <!-- USDC scale: 0->20, 200->156. USDT scale: 200->30, 0->140 -->
  <line x1="20" y1="30" x2="156" y2="140" stroke="#3fb950" stroke-width="2.5"/>

  <!-- Drain point -->
  <circle cx="156" cy="140" r="4" fill="#f85149"/>
  <text x="142" y="158" fill="#f85149" font-size="9" text-anchor="end">(200,0) drained!</text>

  <!-- Midpoint -->
  <circle cx="88" cy="85" r="3" fill="#e6edf3"/>
  <text x="92" y="82" fill="#e6edf3" font-size="9">(100,100)</text>

  <text x="88" y="46" fill="#3fb950" font-size="10" text-anchor="middle">straight diagonal</text>
  <text x="88" y="60" fill="#f85149" font-size="10" text-anchor="middle">touches axes - drains fully</text>

  <!-- ===== CENTER: Constant Product ===== -->
  <text x="260" y="22" fill="#58a6ff" font-size="12" text-anchor="middle" font-weight="bold">Constant Product: x · y = 10,000</text>

  <line x1="192" y1="140" x2="328" y2="140" stroke="#8b949e" stroke-width="1.2"/>
  <line x1="192" y1="140" x2="192" y2="30" stroke="#8b949e" stroke-width="1.2"/>

  <!-- Hyperbola: x*y=10000. USDC: 0->192, 200->328. USDT: 200->30, 0->140 -->
  <polyline points="
    194,35 196,40 198,45 200,50 203,56 206,61 210,67 214,72
    218,77 223,82 228,86 233,90 239,94 245,97 251,101
    258,104 265,107 272,110 280,113 288,116 296,118 304,121
    312,123 320,125 327,127
  " fill="none" stroke="#58a6ff" stroke-width="2.5"/>

  <circle cx="260" cy="94" r="3" fill="#e6edf3"/>
  <text x="264" y="91" fill="#e6edf3" font-size="9">(100,100)</text>

  <text x="260" y="46" fill="#58a6ff" font-size="10" text-anchor="middle">rounded everywhere</text>
  <text x="260" y="60" fill="#58a6ff" font-size="10" text-anchor="middle">never touches axes</text>

  <!-- ===== RIGHT: Ideal StableSwap Blend ===== -->
  <text x="432" y="22" fill="#d2a8ff" font-size="12" text-anchor="middle" font-weight="bold">StableSwap: ideal blend</text>

  <line x1="364" y1="140" x2="500" y2="140" stroke="#8b949e" stroke-width="1.2"/>
  <line x1="364" y1="140" x2="364" y2="30" stroke="#8b949e" stroke-width="1.2"/>

  <!-- Blended curve: flat middle, curved edges -->
  <polyline points="
    366,130 369,110 373,90 378,75 385,64 394,58
    405,54 418,52 432,52 446,52 459,54
    470,58 479,64 486,75 491,90 495,110 498,130
  " fill="none" stroke="#d2a8ff" stroke-width="2.5"/>

  <!-- Flat middle highlight -->
  <line x1="405" y1="54" x2="459" y2="52" stroke="#d2a8ff" stroke-width="3" opacity="0.6"/>

  <circle cx="432" cy="52" r="3" fill="#e6edf3"/>
  <text x="436" y="49" fill="#e6edf3" font-size="9">(100,100)</text>

  <text x="432" y="46" fill="#d2a8ff" font-size="10" text-anchor="middle">flat in the middle</text>
  <text x="432" y="60" fill="#d2a8ff" font-size="10" text-anchor="middle">curved at edges</text>

  <text x="377" y="100" fill="#d2a8ff" font-size="9">curved</text>
  <text x="482" y="100" fill="#d2a8ff" font-size="9">curved</text>
  <text x="420" y="40" fill="#d2a8ff" font-size="9">flat</text>
</svg>
